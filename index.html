
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do you love Alicia?</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffe0e6;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    width: 90%;
    max-width: 500px;
    padding: 30px 15px;
}

.illustration {
    margin-bottom: 20px;
    animation: float 2s infinite ease-in-out;
}

.illustration img {
    display: block;
    width: min(100%, 420px);
    max-height: 320px;
    margin: 0 auto;
    border-radius: 24px;
    object-fit: cover;
    box-shadow: 0 12px 30px rgba(64, 44, 52, 0.18);
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

h1 {
    font-size: 38px;
    color: #171717;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    position: relative;
    height: 65px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 12px 25px;
    font-size: 17px;
    cursor: pointer;
    color: white;
    background: #f36b85;
    box-shadow: 0 4px 12px rgba(240, 80, 120, 0.25);
    transition: background 0.2s;
}

#yes {
    background: #f38ba0;
}

#yes:hover {
    background: #ed5879;
}

#no {
    background: #f05b76;
    position: relative;
    z-index: 10;
}

#dance-button {
    margin-top: 16px;
    background: #8d68c5;
}

#dance-surprise {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(26, 19, 32, 0.78);
}

#dance-surprise[hidden] {
    display: none;
}

#dance-surprise img {
    display: block;
    width: min(100%, 480px);
    max-height: 80vh;
    border-radius: 20px;
    object-fit: contain;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    animation: appear 0.35s ease;
}

#close-dance {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 8px 15px;
    font-size: 30px;
    line-height: 1;
}

#result {
    display: none;
    margin-top: 25px;
    color: #ed5275;
    font-size: 27px;
    font-weight: bold;
    animation: appear 0.6s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: rise 4s linear forwards;
    pointer-events: none;
}

@keyframes rise {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="illustration">
        <img src="assets/snow-leopard-mei-mei.jpg" alt="Deux léopards des neiges">
    </div>

    <h1 id="question">Do you love me?</h1>

    <div class="buttons" id="buttons">

        <button id="yes">Yes</button>

        <button id="no">No</button>

    </div>

    <button id="dance-button" type="button" aria-label="Afficher le GIF de danse">🍌🥵</button>

    <div id="result">
        UR CUTE! 💗🥰
        <p style="font-size: 20px; margin-top: 12px;">
            I LOVE YOU FOREVER! 💕
        </p>
    </div>

</div>

<div id="dance-surprise" role="dialog" aria-modal="true" aria-label="Surprise GIF Fortnite" hidden>
    <button id="close-dance" type="button" aria-label="Fermer">×</button>
    <img src="https://media.tenor.com/KA7FnxhIaloAAAAM/fortnite-fortnite-dance.gif" alt="Un personnage Fortnite danse">
</div>

<script>

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const buttons = document.getElementById("buttons");
const result = document.getElementById("result");
const question = document.getElementById("question");
const danceButton = document.getElementById("dance-button");
const danceSurprise = document.getElementById("dance-surprise");
const closeDanceButton = document.getElementById("close-dance");

danceButton.addEventListener("click", function() {
    danceSurprise.hidden = false;
    closeDanceButton.focus();
});

function closeDanceSurprise() {
    danceSurprise.hidden = true;
    danceButton.focus();
}

closeDanceButton.addEventListener("click", closeDanceSurprise);

danceSurprise.addEventListener("click", function(event) {
    if (event.target === danceSurprise) {
        closeDanceSurprise();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape" && !danceSurprise.hidden) {
        closeDanceSurprise();
    }
});

// Le bouton NO esquive la souris
function moveNoButton() {

    const containerWidth = buttons.clientWidth;
    const containerHeight = buttons.clientHeight;

    const maxX = containerWidth - noBtn.offsetWidth;
    const maxY = containerHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.position = "absolute";
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

// Détecte quand la souris approche du bouton
noBtn.addEventListener("mouseenter", moveNoButton);

// Fonctionne également sur téléphone
noBtn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNoButton();
});

// Quand on clique sur YES
yesBtn.addEventListener("click", function() {

    question.innerHTML = "YAAAY! 💗";

    buttons.style.display = "none";

    result.style.display = "block";

    // Animation des cœurs
    for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 100);
    }

});

// Création des cœurs
function createHeart() {

    const heart = document.createElement("div");

    heart.classList.add("heart");

    const hearts = ["💗", "💕", "💖", "❤️", "💘"];

    heart.innerHTML = hearts[
        Math.floor(Math.random() * hearts.length)
    ];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (2 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);

}

</script>

</body>
</html>
